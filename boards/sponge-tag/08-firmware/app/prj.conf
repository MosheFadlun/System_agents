# sponge-tag bring-up + product firmware (nRF Connect SDK v2.9.3)
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# BLE broadcaster only: no connections (A01: 2 s adv interval)
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_DEVICE_NAME="sponge-tag"

CONFIG_MAIN_STACK_SIZE=2048
